# Push to main → build on CI → clean server build/ → upload → Docker rebuild + compose up
# Server keeps: .env, uploads/ (never touched by CI)

name: Deploy Ecommerce Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run build

      - name: Clean server build folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /home/smalcouture/e-commercebackend
            rm -rf build
            mkdir -p build uploads
            echo "Server build/ cleaned (uploads + .env kept)"

      - name: Upload Build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "build/*"
          target: "/home/smalcouture/e-commercebackend/build"
          strip_components: 1
          overwrite: true

      - name: Upload docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.yml
          target: /home/smalcouture/e-commercebackend/

      - name: Docker rebuild and start
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            sudo chown -R smalcouture:smalcouture /home/smalcouture/e-commercebackend
            chmod -R 755 /home/smalcouture/e-commercebackend

            cd /home/smalcouture/e-commercebackend

            if [ ! -f .env ]; then
              echo "ERROR: .env missing on server — create it manually (CI never uploads .env)"
              exit 1
            fi

            docker compose down || true
            docker compose build --no-cache
            docker compose up -d --force-recreate

            docker image prune -f

            echo "--- Running containers ---"
            docker compose ps
            echo "--- Last logs ---"
            docker logs ecommerce-backend-container --tail 15
