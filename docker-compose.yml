services:
  ecommerce-backend:
    build: ./build
    image: ecommerce-backend:latest
    container_name: ecommerce-backend-container
    restart: unless-stopped
    ports:
      - "5001:4000"
    env_file:
      - .env
    volumes:
      # Synced from repo on each deploy (GitHub Actions)
      - ./uploads:/app/uploads
